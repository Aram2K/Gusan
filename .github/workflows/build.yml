name: Build & Release

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install pytest requests psutil pillow numpy pypdf==6.20.1 --quiet

      - name: Diagnose import
        run: |
          python - <<'EOF'
          import sys, os, types, traceback
          from unittest.mock import MagicMock
          class StubMeta(type):
              def __getattr__(cls, name): return MagicMock()
          class StubBase(metaclass=StubMeta):
              def __init__(self, *args, **kwargs): pass
              def __getattr__(self, name): return MagicMock()
          class StubModule(types.ModuleType):
              def __init__(self, name, attrs=None):
                  super().__init__(name)
                  if attrs:
                      for k,v in attrs.items(): setattr(self,k,v)
              def __getattr__(self, name): return StubBase
          def _stub(name, attrs=None):
              m = StubModule(name, attrs)
              sys.modules[name] = m
              return m
          _stub("pyaudio",{"PyAudio":MagicMock,"paInt16":8,"paFloat32":1})
          _stub("pyaudiowpatch",{"PyAudio":MagicMock,"paInt16":8,"paFloat32":1})
          _stub("pystray",{"Icon":MagicMock,"Menu":MagicMock,"MenuItem":MagicMock})
          _pkb=_stub("pynput.keyboard",{"Controller":MagicMock,"Key":MagicMock})
          _pm=_stub("pynput.mouse",{"Listener":MagicMock,"Button":MagicMock})
          _p=_stub("pynput",{}); _p.keyboard=_pkb; _p.mouse=_pm
          _stub("keyboard",{"add_hotkey":MagicMock,"remove_hotkey":MagicMock,"is_pressed":MagicMock(return_value=False)})
          _stub("pyperclip",{"copy":MagicMock,"paste":MagicMock})
          _stub("faster_whisper",{"WhisperModel":MagicMock})
          _stub("psutil",{"virtual_memory":MagicMock(return_value=MagicMock(total=16*1024**3)),"cpu_count":MagicMock(return_value=8)})
          _stub("ctranslate2",{"get_cuda_device_count":MagicMock(return_value=0)})
          _stub("numpy",{"frombuffer":MagicMock,"abs":MagicMock,"percentile":MagicMock(return_value=100),"concatenate":MagicMock,"array":MagicMock,"int16":MagicMock,"float32":MagicMock,"mean":MagicMock(return_value=0.0)})
          _pi=_stub("PIL.Image",{"new":MagicMock,"LANCZOS":MagicMock})
          _pd=_stub("PIL.ImageDraw",{"Draw":MagicMock})
          _pt=_stub("PIL.ImageTk",{"PhotoImage":MagicMock})
          _pil=_stub("PIL",{}); _pil.Image=_pi; _pil.ImageDraw=_pd; _pil.ImageTk=_pt
          _tk=_stub("tkinter"); _tk.Tk=MagicMock; _tk.Toplevel=MagicMock; _tk.Frame=MagicMock
          _tk.Label=MagicMock; _tk.Canvas=MagicMock; _tk.StringVar=MagicMock
          _tk.IntVar=MagicMock; _tk.BooleanVar=MagicMock; _tk.Text=MagicMock
          _tk.Entry=MagicMock; _tk.Button=MagicMock; _tk.Scrollbar=MagicMock
          _tk.Radiobutton=MagicMock; _tk.END="end"
          _ttt=_stub("tkinter.ttk",{"Scrollbar":MagicMock}); _tk.ttk=_ttt
          _stub("history",{"add":MagicMock,"all":MagicMock(return_value=[]),"clear":MagicMock,"search":MagicMock(return_value=[])})
          _stub("requests",{"get":MagicMock,"post":MagicMock})
          _core = _stub("PySide6.QtCore")
          _gui = _stub("PySide6.QtGui")
          _widgets = _stub("PySide6.QtWidgets")
          _pyside6 = _stub("PySide6")
          _pyside6.QtCore = _core; _pyside6.QtGui = _gui; _pyside6.QtWidgets = _widgets
          sys.path.insert(0,".")
          print("Python", sys.version)
          print("Stubs ready, importing main...")
          try:
              import main
              print("main OK")
          except Exception as e:
              print("IMPORT FAILED:", e)
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=long 2>&1 | tee /tmp/pytest_output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: /tmp/pytest_output.txt

  # ── Windows .exe ─────────────────────────────────────────────────────────────
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # APP_VERSION is read from app_info.py as text (never import main). A
      # tag build stops here when the tag (without the "v") differs from it.
      - name: Check the version
        id: version
        shell: pwsh
        run: |
          $src = Get-Content app_info.py -Raw
          if ($src -notmatch '(?m)^APP_VERSION\s*=\s*"(\d+\.\d+\.\d+)"') {
            throw 'APP_VERSION = "X.Y.Z" not found in app_info.py'
          }
          $app = $Matches[1]
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $v = $Matches[1]
            if ($v -ne $app) {
              throw "Tag v$v does not match APP_VERSION $app in app_info.py - bump app_info.py or fix the tag."
            }
          } else {
            $v = "$app-dev"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_version=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $v (app_info.py: $app)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller==6.22.3 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      # The Gusan window, pages, welcome and floating surfaces, built for real
      # (offscreen) on the build's Python - the test job runs tests/ with
      # stand-ins for Qt. compileall catches syntax this Python can't read in
      # modules the tests don't import. The suite takes ~3-5 min locally; the
      # cap stops a hung test from holding the job for GitHub's 6-hour default.
      - name: Qt window tests (offscreen)
        shell: pwsh
        timeout-minutes: 25
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest --quiet
          python -m compileall -q -l .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests_qt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate app icon
        shell: pwsh
        run: |
          pip install pillow --quiet
          python installer/make_icon.py

      # Windows shows these in Task Manager, Startup apps, notifications and
      # the file's Properties: "Gusan" by AIBUBEN, while the file itself stays
      # TranscribeApp.exe. Same script as build.ps1 (tests/test_release_2_0_0.py
      # checks they match).
      - name: Write the Windows version info
        shell: pwsh
        run: |
          # version-info:begin
          @'
          import os, re, sys
          src = open("app_info.py", encoding="utf-8").read()
          name = re.search(r'^APP_NAME\s*=\s*"([^"]+)"', src, re.M).group(1)
          ver = re.search(r'^APP_VERSION\s*=\s*"(\d+)\.(\d+)\.(\d+)"', src, re.M)
          nums = tuple(int(x) for x in ver.groups()) + (0,)
          dotted = ".".join(str(n) for n in nums)
          strings = [
              ("CompanyName", "AIBUBEN"),
              ("FileDescription", name),
              ("FileVersion", dotted),
              ("InternalName", "TranscribeApp"),
              ("LegalCopyright", "Copyright (c) 2025 Aram Adamyan. All rights reserved."),
              ("OriginalFilename", "TranscribeApp.exe"),
              ("ProductName", name),
              ("ProductVersion", dotted),
          ]
          text = (
              "VSVersionInfo(\n"
              "  ffi=FixedFileInfo(filevers=%r, prodvers=%r, mask=0x3f, flags=0x0,\n"
              "                    OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),\n"
              "  kids=[\n"
              "    StringFileInfo([StringTable('040904B0', [\n"
              "%s\n"
              "    ])]),\n"
              "    VarFileInfo([VarStruct('Translation', [1033, 1200])]),\n"
              "  ]\n"
              ")\n"
          ) % (nums, nums, ",\n".join("      StringStruct(%r, %r)" % kv for kv in strings))
          out = sys.argv[1]
          os.makedirs(os.path.dirname(out) or ".", exist_ok=True)
          with open(out, "w", encoding="utf-8") as f:
              f.write(text)
          print("Version info: %s %s -> %s" % (name, dotted, out))
          '@ | python - build/version_info.txt
          # version-info:end
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build .exe
        shell: pwsh
        run: |
          pyinstaller `
            --onedir --windowed `
            --name TranscribeApp `
            --icon assets/icon.ico `
            --version-file build/version_info.txt `
            --add-data "config.example.json;." `
            --add-data "history.py;." `
            --add-data "assets;assets" `
            --hidden-import faster_whisper `
            --hidden-import faster_whisper.utils `
            --hidden-import tqdm `
            --hidden-import tqdm.auto `
            --hidden-import ctranslate2 `
            --hidden-import huggingface_hub `
            --hidden-import llama_cpp `
            --hidden-import tokenizers `
            --hidden-import pyaudiowpatch `
            --hidden-import sherpa_onnx `
            --hidden-import sherpa_onnx.lib._sherpa_onnx `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all llama_cpp `
            --collect-all pystray `
            --collect-all pynput `
            --collect-all pyaudiowpatch `
            --collect-all sherpa_onnx `
            --exclude-module torch `
            --exclude-module openai `
            --exclude-module numba `
            --exclude-module llvmlite `
            --exclude-module matplotlib `
            --exclude-module IPython `
            main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vi = (Get-Item dist\TranscribeApp\TranscribeApp.exe).VersionInfo
          Write-Host "Exe: $($vi.ProductName) / $($vi.FileDescription) $($vi.FileVersion) by $($vi.CompanyName)"
          if ($vi.FileVersion -ne "${{ steps.version.outputs.app_version }}.0") {
            throw "TranscribeApp.exe has no version info for ${{ steps.version.outputs.app_version }}"
          }
          # multimedia-check:begin
          # Meetings play their recording in the app (Qt's Windows media plugin; the same check in build.yml and build.ps1).
          $mm = "dist\TranscribeApp\_internal\PySide6\plugins\multimedia\windowsmediaplugin.dll"
          if (-not (Test-Path $mm)) { throw "No Qt multimedia plugin in the build ($mm): meetings can't play their recording." }
          Write-Host "Multimedia plugin: $mm"
          # multimedia-check:end

      - name: Zip output folder (portable build)
        shell: pwsh
        run: Compress-Archive -Path dist\TranscribeApp\* -DestinationPath TranscribeApp-Windows.zip

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc /DMyAppVersion="${{ steps.version.outputs.version }}" installer\installer.iss
          Move-Item installer\TranscribeApp-Setup.exe TranscribeApp-Windows-Setup.exe

      - name: Generate Windows checksums
        shell: pwsh
        run: |
          foreach ($file in @("TranscribeApp-Windows-Setup.exe", "TranscribeApp-Windows.zip")) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content "$file.sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            TranscribeApp-Windows-Setup.exe
            TranscribeApp-Windows-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            TranscribeApp-Windows.zip
            TranscribeApp-Windows.zip.sha256

  # ── macOS .dmg ───────────────────────────────────────────────────────────────
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The same check as the Windows job: a tag must match APP_VERSION in
      # app_info.py (read as text). The plain X.Y.Z goes into Info.plist.
      - name: Check the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          app="$(sed -nE 's/^APP_VERSION[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app_info.py | head -n 1)"
          if [ -z "${app}" ]; then
            echo "::error::APP_VERSION = \"X.Y.Z\" not found in app_info.py"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "${tag}" != "${app}" ]; then
              echo "::error::Tag v${tag} does not match APP_VERSION ${app} in app_info.py - bump app_info.py or fix the tag."
              exit 1
            fi
          fi
          echo "app_version=${app}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${app}"

      - name: Install system deps
        run: brew install portaudio python-tk@3.11

      - name: Install Python dependencies
        run: |
          /opt/homebrew/bin/python3.11 -m pip install --upgrade pip
          /opt/homebrew/bin/python3.11 -m pip install -r requirements.txt pyinstaller==6.22.3 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Build .app
        run: |
          /opt/homebrew/bin/python3.11 -m PyInstaller \
            --onedir --windowed \
            --name TranscribeApp \
            --add-data "config.example.json:." \
            --add-data "history.py:." \
            --add-data "assets:assets" \
            --hidden-import faster_whisper \
            --hidden-import faster_whisper.utils \
            --hidden-import tqdm \
            --hidden-import tqdm.auto \
            --hidden-import ctranslate2 \
            --hidden-import huggingface_hub \
            --hidden-import llama_cpp \
            --hidden-import tokenizers \
            --hidden-import sherpa_onnx \
            --hidden-import sherpa_onnx.lib._sherpa_onnx \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all llama_cpp \
            --collect-all pystray \
            --collect-all pynput \
            --collect-all sherpa_onnx \
            --exclude-module torch \
            --exclude-module openai \
            --exclude-module numba \
            --exclude-module llvmlite \
            --exclude-module matplotlib \
            --exclude-module IPython \
            main.py

      - name: Patch Info.plist (name, version, usage strings)
        # macOS shows the value of these strings in the system permission
        # prompts. Without them, the prompt is generic / sometimes doesn't
        # appear at all and the underlying API silently fails — which was
        # the root cause of "the hotkey doesn't work on Mac" reports.
        # The menu bar, Force Quit and the prompts say Gusan (CFBundleName /
        # CFBundleDisplayName). Kept on purpose: TranscribeApp.app, its
        # executable and the bundle id PyInstaller derives from --name.
        # Must run BEFORE code-signing so the signature seals the patched bundle.
        run: |
          set -euo pipefail
          PLIST="dist/TranscribeApp.app/Contents/Info.plist"
          VERSION="${{ steps.version.outputs.app_version }}"
          # Set a string value, adding the key when PyInstaller didn't write it.
          plist_set() {
            /usr/libexec/PlistBuddy -c "Set :$1 \"$2\"" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$1 string \"$2\"" "$PLIST"
          }
          plist_set CFBundleName "Gusan"
          plist_set CFBundleDisplayName "Gusan"
          plist_set CFBundleShortVersionString "$VERSION"
          plist_set CFBundleVersion "$VERSION"
          plist_set NSMicrophoneUsageDescription "Gusan records your microphone to turn speech into text. Audio stays on your Mac unless you pick a cloud speech engine."
          plist_set NSAppleEventsUsageDescription "Gusan pastes transcribed text into the focused window via simulated keystrokes."
          # Surface the global-hotkey requirement so macOS shows a clear
          # prompt under Privacy & Security → Accessibility.
          plist_set NSInputMonitoringUsageDescription "Gusan needs to listen for your global hotkey (default: Option+R) so you can start dictation from any app."
          plutil -lint "$PLIST"
          plutil -p "$PLIST"

      - name: Ad-hoc sign the .app
        # Without an Apple Developer ID we can only sign ad-hoc. This still
        # produces a valid signature (so the hardened runtime and library
        # validation don't complain), but Gatekeeper will still warn on
        # first launch. Users bypass it once via right-click → Open.
        run: |
          codesign --force --deep --sign - dist/TranscribeApp.app
          codesign --verify --verbose=2 dist/TranscribeApp.app || true

      - name: Package as DMG
        run: |
          hdiutil create \
            -volname "Gusan" \
            -srcfolder dist/TranscribeApp.app \
            -ov -format UDZO \
            TranscribeApp-Mac.dmg
          shasum -a 256 TranscribeApp-Mac.dmg > TranscribeApp-Mac.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            TranscribeApp-Mac.dmg
            TranscribeApp-Mac.dmg.sha256

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to diff against the previous tag

      - uses: actions/download-artifact@v4

      - name: Generate release notes from commits
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prev="$(git tag --sort=-version:refname --list 'v*.*.*' | grep -vFx "${tag}" | head -n 1 || true)"
          {
            # Hand-written notes win when present (docs/release-notes/<tag>.md);
            # otherwise fall back to the commit-log digest.
            if [ -f "docs/release-notes/${tag}.md" ]; then
              cat "docs/release-notes/${tag}.md"
              echo
              if [ -n "${prev}" ]; then
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
              fi
            else
            echo "## What's new in ${tag}"
            echo
            if [ -n "${prev}" ]; then
              echo "Changes since **${prev}**:"
              echo
              git log --no-merges --pretty=format:'- %s' "${prev}..${tag}"
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            else
              echo "First tagged release."
              echo
              git log --no-merges --pretty=format:'- %s' "${tag}"
            fi
            fi
            echo
            echo
            echo "### Download"
            echo "- **Windows installer**: \`TranscribeApp-Windows-Setup.exe\`"
            echo "- **Windows portable**: \`TranscribeApp-Windows.zip\`"
            echo "- **macOS**: \`TranscribeApp-Mac.dmg\` — on first launch right-click → **Open** to bypass Gatekeeper (the app is ad-hoc signed, not notarized)."
            echo
            echo "### About"
            echo "Created by Aram Adamyan, founder of Aibuben — an AI community for learning, building, and sharing practical AI tools."
            echo "- Explore other tools and projects: https://aibuben.xyz/products"
            echo "- Aibuben homepage: https://aibuben.xyz"
            echo "- Project repository: https://github.com/${GITHUB_REPOSITORY}"
          } > release_notes.md
          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: Generate update manifest
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def read_hash(path):
              text = pathlib.Path(path).read_text(encoding="utf-8").strip()
              return text.split()[0].lower()

          manifest = {
              "schema": 1,
              "version": version,
              "tag": tag,
              "notes_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "windows": {
                  "installer": {
                      "name": "TranscribeApp-Windows-Setup.exe",
                      "url": f"{base}/TranscribeApp-Windows-Setup.exe",
                      "sha256": read_hash("windows-installer/TranscribeApp-Windows-Setup.exe.sha256"),
                      "sha256_url": f"{base}/TranscribeApp-Windows-Setup.exe.sha256",
                  },
                  "portable": {
                      "name": "TranscribeApp-Windows.zip",
                      "url": f"{base}/TranscribeApp-Windows.zip",
                      "sha256": read_hash("windows-zip/TranscribeApp-Windows.zip.sha256"),
                      "sha256_url": f"{base}/TranscribeApp-Windows.zip.sha256",
                  },
              },
              "macos": {
                  "dmg": {
                      "name": "TranscribeApp-Mac.dmg",
                      "url": f"{base}/TranscribeApp-Mac.dmg",
                      "sha256": read_hash("macos-dmg/TranscribeApp-Mac.dmg.sha256"),
                      "sha256_url": f"{base}/TranscribeApp-Mac.dmg.sha256",
                  },
              },
          }
          pathlib.Path("update-manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            update-manifest.json
            windows-installer/TranscribeApp-Windows-Setup.exe
            windows-installer/TranscribeApp-Windows-Setup.exe.sha256
            windows-zip/TranscribeApp-Windows.zip
            windows-zip/TranscribeApp-Windows.zip.sha256
            macos-dmg/TranscribeApp-Mac.dmg
            macos-dmg/TranscribeApp-Mac.dmg.sha256
